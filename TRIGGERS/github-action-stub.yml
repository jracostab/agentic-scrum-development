# Optional stub — does not invoke agents

# .github/workflows/scrum-commands.yml
name: scrum-commands
on:
  issue_comment:
    types: [created]
jobs:
  note:
    if: contains(github.event.comment.body, '/implement')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "Assigned Developer. Waiting G3 (plan/RCA + Founder approved/proceed/handle)."
            })
