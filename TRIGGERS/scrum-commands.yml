name: scrum-commands
on:
  issue_comment:
    types: [created]
jobs:
  note:
    if: |
      contains(github.event.comment.body, '/implement') ||
      contains(github.event.comment.body, '/plan') ||
      contains(github.event.comment.body, '/rca')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.comment.body
            let msg = "Scrum bot: command recorded. Human Founder still owns G3/G4."
            if (body.includes("/implement")) {
              msg = "Assigned Developer. Waiting G3 (plan/RCA + Founder approved/proceed/handle)."
            } else if (body.includes("/plan")) {
              msg = "Developer/PO: post a plan comment only. No code until approved."
            } else if (body.includes("/rca")) {
              msg = "Developer: post RCA only. No code until approved."
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: msg,
            })
