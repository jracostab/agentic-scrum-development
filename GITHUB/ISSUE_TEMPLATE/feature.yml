name: Feature
description: Slice of an epic. Choose Type Feature. Sub-issue of the parent Epic.
title: ""
body:
  - type: markdown
    attributes:
      value: |
        Set **Type** to **Feature**. Set parent to the Epic (sub-issue). Same venture Project.
  - type: input
    id: parent
    attributes:
      label: Parent epic number
      placeholder: "12"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
    validations:
      required: true
  - type: textarea
    id: dod
    attributes:
      label: Definition of Done
      value: |
        - [ ] Stories covering this slice exist
        - [ ] User-visible behavior is named
    validations:
      required: true
