name: Bug
description: Defect. Choose Type Bug. Shows on the same Project in the Defects view.
body:
  - type: markdown
    attributes:
      value: |
        Set **Type** to **Bug**. Add to the venture Project — Defects view is a filter, not another project.
  - type: textarea
    id: description
    attributes:
      label: Description
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: symptoms
    attributes:
      label: Symptoms
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: dod
    attributes:
      label: Definition of Done
      value: |
        - [ ] Repro no longer fails
        - [ ] Regression test added
    validations:
      required: true
  - type: textarea
    id: ac
    attributes:
      label: Acceptance Criteria
      description: Observable checks that this defect is resolved from the user's point of view.
      value: |
        - [ ]
    validations:
      required: true
